name: Dati di prova

# Carica nel progetto Supabase i dati FINTI di supabase/seed/demo.sql (atleti, check-in, sedute, chat).
# Parte da solo quando il file cambia su main, oppure a mano da Actions > Dati di prova > Run workflow.
# Usa l'API di gestione di Supabase con il segreto SUPABASE_ACCESS_TOKEN.
on:
  push:
    branches: [main]
    paths: [supabase/seed/demo.sql, .github/workflows/demo-data.yml]
  workflow_dispatch:

concurrency: demo-data

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: eizgzpfkumigvfzjaudu
    steps:
      - uses: actions/checkout@v4
      - name: Esegue supabase/seed/demo.sql
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Manca il segreto SUPABASE_ACCESS_TOKEN"; exit 1; fi
          jq -Rs '{query: .}' supabase/seed/demo.sql > body.json
          status=$(curl -sS -o out.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @body.json)
          cat out.json; echo
          if [ "$status" -ge 300 ]; then echo "::error::La query è fallita (HTTP $status)"; exit 1; fi
      - name: Riepilogo
        run: |
          jq -n --arg q "select (select count(*) from public.care_links where status='active') as collegamenti, (select count(*) from public.daily_entries) as giornalieri, (select count(*) from public.weekly_checkins) as settimanali, (select count(*) from public.workout_logs) as sedute, (select count(*) from public.messages) as messaggi" '{query: $q}' > q.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @q.json
